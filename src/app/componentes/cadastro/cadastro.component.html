<div fxLayout="row" fxLayoutAlign="center center">
   <div fxLayout="column" fxFlex="1000px">
     <form  class="mt-60" #clientesFrm="ngForm" (ngSubmit)="salvar()">
         <mat-card>
           <mat-card-header>
               <mat-card-title>Dados Pessoais</mat-card-title>
           </mat-card-header>
           <mat-card-content class="mt-20">

             <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
              <div fxLayout="column" fxFlex="800px">
                <mat-form-field class="full-width">
                  <mat-label>Nome: *</mat-label>
                  <input type="text" [(ngModel)]="cliente.nome" name="nome" placeholder="Ex: José da Silva" matInput />
                </mat-form-field>
              </div>

             </div>

             <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
              <div fxLayout="column" fxFlex="800px">
                <mat-form-field class="full-width">
                  <mat-label>Email: *</mat-label>
                  <input type="email" [(ngModel)]="cliente.email" name="email" id="email" placeholder="Digite seu email" matInput />
                </mat-form-field>
             </div>

             </div>

             <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
              <div fxLayout="column" fxFlex="400px">
                <mat-form-field class="full-width">
                  <mat-label>CPF: *</mat-label>
                  <input type="text" [(ngModel)]="cliente.cpf" name="cpf" id="cpf" placeholder="Digite seu cpf" matInput />
               </mat-form-field>
              </div>

             </div>

             <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
               <div fxLayout="column" fxFlex="400px">
                <mat-form-field class="full-width">
                   <mat-label>Data Nascimento: *</mat-label>
                   <input type="date" [(ngModel)]="cliente.dataNascimento" name="dataNascimento" id="dataNascimento" placeholder="Digite sua data de nascimento" matInput />
                </mat-form-field>
            </div>
         </div>


           </mat-card-content>
          <mat-card-actions>

                <button type="submit" mat-flat-button color="primary">
                   <mat-icon fontIcon="save"></mat-icon>
                     Salvar
                </button>
                <button type="button" mat-flat-button color="primary">
                   <mat-icon fontIcon="refresh"></mat-icon>
                     Atualizar
                </button>
                <button type="button" mat-flat-button color="accent" class="ml-5">
                   <mat-icon fontIcon="backspace"></mat-icon>
                     Limpar
                </button>



          </mat-card-actions>
         </mat-card>
     </form>
   </div>
</div>
